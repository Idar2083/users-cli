version: '3.8'

services:
  php:
    image: php:8.2-cli
    volumes:
      - .:/app
    working_dir: /app
    tty: true
    depends_on:
        - db

  db:
        image: mysql:8.0
        environment:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: users_db
        ports:
          - "3306:3306"
        volumes:
          - db_data:/var/lib/mysql
volumes:
  db_data: